<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Smart Shopping List</title>
    <link rel="stylesheet" href="signup.css">
</head>

<body>

    <!-- Registration Section -->
    <main class="signup-container">

        <div class="signup-card">

            <!-- Heading -->
            <div class="signup-header">
                <h1>Create Account</h1>
                <p>Join Smart Shopping List and organize your shopping.</p>
            </div>

            <!-- Signup Form -->
            <form id="signup-form">

                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Create a password" minlength="6"
                        required>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm-password"
                        placeholder="Confirm your password" minlength="6" required>
                </div>

                <button type="submit" id="signup-button">
                    Create Account
                </button>

                <p id="signup-message"></p>

            </form>

            <!-- Sign In Link -->
            <div class="login-link">
                <p>
                    Already have an account?
                    <a href="login.html">Sign In</a>
                </p>
            </div>

            <!-- Back to Home -->
            <div class="home-link">
                <a href="index.html">Back to Home</a>
            </div>

        </div>

    </main>

        <script src="auth.js"></script>

</body>

</html>
