<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Shopping List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header Section -->
    <header>
        <h1>Smart Shopping List</h1>
        <p>Plan your shopping and manage your budget.</p>
    </header>

     <main class="container">

        <!-- Shopping Summary -->
        <section class="summary">
            <div class="summary-card">
                <h3>Total Items</h3>
                <p id="total-items">0</p>
            </div>

            <div class="summary-card">
                <h3>Purchased</h3>
                <p id="purchased-items">0</p>
            </div>

            <div class="summary-card">
                <h3>Remaining</h3>
                <p id="remaining-items">0</p>
            </div>

            <div class="summary-card">
                <h3>Estimated Cost</h3>
                <p id="estimated-cost">KSh 0</p>
            </div>
        </section>

           <!-- Shopping List -->
        <section class="shopping-list">

            <h2>My Shopping List</h2>

            <!-- Search and Filter -->
            <div class="list-controls">

                <input
                    type="search"
                    id="search-input"
                    placeholder="Search items..."
                >

                <select id="category-filter">
                    <option value="All">All Categories</option>
                    <option value="Groceries">Groceries</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Clothing">Clothing</option>
                    <option value="Household">Household Items</option>
                    <option value="Personal Care">Personal Care</option>
                    <option value="Other">Other</option>
                </select>

                <select id="status-filter">
                    <option value="All">All Items</option>
                    <option value="Pending">Pending</option>
                    <option value="Purchased">Purchased</option>
                </select>

            </div>
             
            <div id="shopping-items">

                <p id="empty-message">
                    Your shopping list is empty. Add your first item!
                </p>

            </div>
