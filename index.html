<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Shopping List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header Section -->
    <header>
        <h1>Smart Shopping List</h1>
        <p>Plan your shopping and manage your budget.</p>
    </header>

     <main class="container">

        <!-- Shopping Summary -->
        <section class="summary">
            <div class="summary-card">
                <h3>Total Items</h3>
                <p id="total-items">0</p>
            </div>

            <div class="summary-card">
                <h3>Purchased</h3>
                <p id="purchased-items">0</p>
            </div>

            <div class="summary-card">
                <h3>Remaining</h3>
                <p id="remaining-items">0</p>
            </div>

            <div class="summary-card">
                <h3>Estimated Cost</h3>
                <p id="estimated-cost">KSh 0</p>
            </div>
        </section>
