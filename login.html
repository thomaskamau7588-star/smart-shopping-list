<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Smart Shopping List</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <!-- Login Container -->
    <main class="login-container">

        <div class="login-card">

            <!-- Login Header -->
            <div class="login-header">
                <h1>Welcome Back!</h1>
                <p>Sign in to manage your shopping list.</p>
            </div>
            <!-- Login Form -->
            <form id="login-form">

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input type="password" id="password" name="password" placeholder="Enter your password"
                        autocomplete="current-password" minlength="6" required>
                </div>

                <button type="submit" id="login-button">
                    Sign In
                </button>

                <p id="login-message"></p>

            </form>
            <!-- Signup Link -->
            <div class="signup-link">
                <p>
                    Don't have an account?
                    <a href="signup.html">Create Account</a>
                </p>
            </div>

            <!-- Back to Home -->
            <div class="home-link">
                <a href="index.html">Back to Home</a>
            </div>

        </div>

    </main>

</body>
</html>
